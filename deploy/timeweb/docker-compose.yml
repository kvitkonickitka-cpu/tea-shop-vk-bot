# Бот на своей ВМ (Timeweb) — запасной путь, когда Yandex Serverless лежит.
# Сборка из этого же репозитория, HTTPS — Caddy с сертификатом Let's Encrypt.
#   cd deploy/timeweb && docker compose up -d --build

# Логи Docker по умолчанию не ротируются: бот пишет пульс каждую минуту, а
# снаружи ходят сканеры — без лимита журнал рано или поздно съест диск ВМ.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  bot:
    build: ../..
    env_file: .env.bot
    environment:
      PORT: "8080"
      # Очереди Yandex здесь нет — вместо неё своя в Postgres
      # (app/modules/queue/local.py): вебхук сразу отвечает ВК, ход идёт в
      # фоне, работает склейка сообщений. Откат — "false" и `up -d bot`:
      # тогда событие снова разбирается прямо в вебхуке, без склейки.
      YMQ_QUEUE_URL: ""
      LOCAL_QUEUE_ENABLED: "true"
      # Monitoring берёт токен из метаданных ВМ Yandex — здесь их нет.
      YC_FOLDER_ID: ""
    # Только для cron на этой же машине — снаружи бот виден через Caddy.
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      # Postgres на этой же ВМ: из контейнера он — host.docker.internal.
      - "host.docker.internal:host-gateway"
    volumes:
      # История и код для ассистента Ops — только на чтение. В git секретов
      # нет: .env.bot он не отслеживает. Остального репозитория в контейнере нет.
      - ../../.git:/repo/.git:ro
    restart: unless-stopped
    logging: *logging
    # При нехватке памяти на ВМ ядро должно выбрать Metabase, а не бота,
    # который отвечает клиентам.
    oom_score_adj: -500
    # Обычно ~200 МБ. Потолок — от утечки: лучше перезапуск бота (restart
    # поднимет его за секунды), чем база без памяти. Без swap — ответ ВК ждёт 8 с.
    mem_limit: 1g
    memswap_limit: 1g

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - bot
    restart: unless-stopped
    logging: *logging
    oom_score_adj: -500

volumes:
  caddy_data: {}
