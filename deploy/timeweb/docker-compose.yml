# Бот на своей ВМ (Timeweb) — запасной путь, когда Yandex Serverless лежит.
# Сборка из этого же репозитория, HTTPS — Caddy с сертификатом Let's Encrypt.
#   cd deploy/timeweb && docker compose up -d --build

# Логи Docker по умолчанию не ротируются: бот пишет пульс каждую минуту, а
# снаружи ходят сканеры — без лимита журнал рано или поздно съест диск ВМ.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  bot:
    build: ../..
    env_file: .env.bot
    environment:
      PORT: "8080"
      # Очереди Yandex здесь нет: без неё бот обрабатывает событие сразу.
      YMQ_QUEUE_URL: ""
      # Monitoring берёт токен из метаданных ВМ Yandex — здесь их нет.
      YC_FOLDER_ID: ""
    # Только для cron на этой же машине — снаружи бот виден через Caddy.
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      # Postgres на этой же ВМ: из контейнера он — host.docker.internal.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging: *logging
    # Памяти на ВМ впритык (2 ГБ, увеличить нельзя): при нехватке ядро должно
    # выбрать Metabase, а не бота, который отвечает клиентам.
    oom_score_adj: -500

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - bot
    restart: unless-stopped
    logging: *logging
    oom_score_adj: -500

volumes:
  caddy_data: {}
