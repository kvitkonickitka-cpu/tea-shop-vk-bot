# Договор с Yandex DataLens: представления схемы analytics, их столбцы и типы.
#
# Столбцы только добавляются — в конец списка, вместе с правкой
# app/modules/analytics/views.py. Существующие не переименовываются, не
# удаляются и не меняют тип: на них уже построены чарты. Тест
# tests/test_analytics_contract.py сверяет базу с этим файлом и падает на
# любом расхождении, в том числе на новом столбце, которого здесь нет.
# Типы — как их называет information_schema.columns.

