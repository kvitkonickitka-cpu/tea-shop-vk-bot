[pytest]
testpaths = tests
asyncio_mode = auto
# Тестам нужна живая Postgres: бот без базы уходит в память, и половина
# проверок (журнал отправок, outbox, черновики) проверяла бы не то. Адрес
# задаётся TEST_DATABASE_URL, иначе такие тесты пропускаются.
filterwarnings =
    ignore::DeprecationWarning
