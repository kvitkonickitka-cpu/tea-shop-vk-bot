name: Deploy to Yandex Cloud

on:
  push:
    branches: [main]
  # Ручной запуск из вкладки Actions: нужен, чтобы перевыкатить ревизию после
  # правок вне репозитория — смены секрета, роли сервисного аккаунта, правила
  # в группе безопасности, — не засоряя историю пустыми коммитами.
  workflow_dispatch:

env:
  IMAGE_NAME: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/tea-shop-vk-bot
  YC_CONTAINER_NAME: tea-shop-vk-bot
  # Сеть виртуалки с Postgres. Контейнер подключается к ней, чтобы ходить к
  # базе по внутреннему адресу (10.129.0.4), а не по публичному: у
  # serverless-контейнера нет постоянного исходящего адреса, и держать его в
  # списке разрешённых префиксов вручную невозможно. Группа безопасности
  # отдельным флагом не задаётся — контейнер получает группу сети по
  # умолчанию, а это и есть default-sg-enps8ig7g281pqd0l6je.
  YC_NETWORK_ID: enps8ig7g281pqd0l6je

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a -i /home/runner/yandex-cloud
          echo "/home/runner/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Authenticate yc CLI
        run: |
          echo '${{ secrets.YC_SA_KEY }}' > sa-key.json
          yc config set service-account-key sa-key.json
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}

      - name: Configure Docker for Yandex Container Registry
        run: yc container registry configure-docker

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -t ${{ env.IMAGE_NAME }}:latest .

      - name: Push image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

      # --environment разделяет переменные запятыми, поэтому значение с
      # запятыми внутри (адрес отправки) берётся в кавычки: парсер yc
      # разбирает строку как CSV и кавычки в начале поля понимает. Без них
      # деплой падает с «... must be formatted as key=value».
      - name: Deploy new revision to Serverless Container
        run: |
          yc serverless container revision deploy \
            --container-name ${{ env.YC_CONTAINER_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --cores 1 \
            --memory 512MB \
            --concurrency 8 \
            --execution-timeout 60s \
            --min-instances 1 \
            --service-account-id ${{ secrets.YC_SA_ID }} \
            --network-id ${{ env.YC_NETWORK_ID }} \
            --environment "APP_REVISION=${{ github.sha }},VK_CONFIRMATION_TOKEN=${{ secrets.VK_CONFIRMATION_TOKEN }},VK_SECRET_KEY=${{ secrets.VK_SECRET_KEY }},VK_GROUP_ID=${{ secrets.VK_GROUP_ID }},VK_ACCESS_TOKEN=${{ secrets.VK_ACCESS_TOKEN }},VK_USER_TOKEN=${{ secrets.VK_USER_TOKEN }},VK_API_VERSION=5.199,ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }},ANTHROPIC_MODEL=claude-sonnet-5,ANTHROPIC_BASE_URL=${{ secrets.ANTHROPIC_BASE_URL }},DATABASE_URL=${{ secrets.DATABASE_URL }},CDEK_API_BASE_URL=https://api.cdek.ru,CDEK_CLIENT_ID=${{ secrets.CDEK_CLIENT_ID }},CDEK_CLIENT_SECRET=${{ secrets.CDEK_CLIENT_SECRET }},\"CDEK_FROM_ADDRESS=${{ secrets.CDEK_FROM_ADDRESS }}\",CDEK_SHIPMENT_POINT=KSD296,CDEK_DEFAULT_PACKAGE_WEIGHT_GRAMS=200,TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }},TELEGRAM_MANAGER_CHAT_ID=${{ secrets.TELEGRAM_MANAGER_CHAT_ID }},TELEGRAM_API_BASE_URL=${{ secrets.TELEGRAM_API_BASE_URL }},TELEGRAM_PROXY_SECRET=${{ secrets.TELEGRAM_PROXY_SECRET }},TELEGRAM_REPORTS_CHAT_ID=${{ secrets.TELEGRAM_REPORTS_CHAT_ID }},TELEGRAM_ORDERS_CHAT_ID=${{ secrets.TELEGRAM_ORDERS_CHAT_ID }},INTERNAL_API_TOKEN=${{ secrets.INTERNAL_API_TOKEN }},OZON_CLIENT_ID=${{ secrets.OZON_CLIENT_ID }},OZON_CLIENT_SECRET=${{ secrets.OZON_CLIENT_SECRET }},OZON_SHIPMENT_METHOD_ID=${{ secrets.OZON_SHIPMENT_METHOD_ID }},YMQ_QUEUE_URL=${{ secrets.YMQ_QUEUE_URL }},YMQ_ACCESS_KEY_ID=${{ secrets.YMQ_ACCESS_KEY_ID }},YMQ_SECRET_ACCESS_KEY=${{ secrets.YMQ_SECRET_ACCESS_KEY }},YOOKASSA_SHOP_ID=${{ secrets.YOOKASSA_SHOP_ID }},YOOKASSA_SECRET_KEY=${{ secrets.YOOKASSA_SECRET_KEY }},YOOKASSA_RETURN_URL=${{ secrets.YOOKASSA_RETURN_URL }},RUSSIAN_POST_ENABLED=false,PAYMENTS_ENABLED=true"
